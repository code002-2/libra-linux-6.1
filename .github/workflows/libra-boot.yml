name: libra-boot

on:
  workflow_dispatch:
  push:
    branches: [master, main]

concurrency:
  group: libra-boot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build libra boot image
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            mkbootimg \
            cpio curl xz-utils

      - name: Build kernel + initramfs + boot.img
        run: |
          bash scripts/build-libra.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libra-boot
          path: |
            boot.img
            Image.gz-dtb
            initramfs.cpio.gz
            arch/arm64/boot/dts/qcom/msm8992-xiaomi-libra.dtb
          retention-days: 7
          if-no-files-found: error
